name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock.txt
      - run: pip install -r pipeline/requirements.lock.txt
      # The raw CSV is not in the repository; tests that need it are skipped and
      # the rest check the committed artifacts, parity fixtures and publication rules.
      - run: python -m pytest -q pipeline/tests

  build:
    name: Lint, type-check, test and build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # oxlint exits 0 on warnings by default; fail the build on any of them.
      - run: npm run lint -- --deny-warnings
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-dist.mjs dist --base "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [pipeline-tests, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
